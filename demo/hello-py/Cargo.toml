[package]
name = "hello-py"
description = "The Python binding for `hello`, generated by jedem."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "hello"
crate-type = ["cdylib"]

[dependencies]
hello = { path = "../hello" }
pyo3 = { version = "0.23", features = ["extension-module"] }
