[package]
name = "hello-node"
description = "The TypeScript/Node binding for `hello`, generated by jedem."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
hello = { path = "../hello" }
napi = { version = "3", default-features = false, features = ["napi4"] }
napi-derive = "3"

[build-dependencies]
napi-build = "2"
