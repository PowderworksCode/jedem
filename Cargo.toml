[workspace]
resolver = "2"
members = ["crates/jedem", "crates/jedem-macros", "crates/cargo-jedem", "demo/hello", "demo/hello/bindings/python", "demo/hello/bindings/node"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/PowderworksCode/jedem"
# `#[diagnostic::on_unimplemented]`, which turns "trait not implemented" into a
# sentence naming the missing derive, stabilised in 1.78. Declared here so a
# crate taking a jedem dependency reads its floor from the manifest rather than
# discovering it when its own MSRV job fails.
rust-version = "1.78"

[workspace.dependencies]
jedem = { path = "crates/jedem", version = "0.1.0" }
jedem-macros = { path = "crates/jedem-macros", version = "0.1.0" }
