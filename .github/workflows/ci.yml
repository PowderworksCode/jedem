name: ci

on:
  push: { branches: [main] }
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # Every CI run contributes this build to the public compile-time census
      # at <https://cratebank.io/>. It builds what the steps below would have
      # built anyway, measured, so what is added here is mostly the measuring.
      #
      # `strict` because this is the build. A measurement that quietly did not
      # happen would mean nothing built the project either, and a green check
      # would be saying so about work that never ran.
      - uses: PowderworksCode/cratebank/action@v0.1.1
        with:
          args: --workspace
          org-id: powderworks
          strict: "true"

      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all

  # The end-to-end proofs: a real host process importing generated bindings and
  # calling them. `cargo jedem run` builds the binding, places the artefact
  # under the name that runtime imports, and runs the script -- the eight lines
  # of shell each of these used to need now live in the tool.
  roundtrips:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: cargo install --path crates/cargo-jedem
      - run: cargo jedem run --python test.py
        working-directory: demo/python
      - run: cargo jedem run --node test.mjs
        working-directory: demo/node
