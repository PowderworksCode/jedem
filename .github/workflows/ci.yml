name: ci

on:
  push: { branches: [main] }
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # What a pull request touched decides what the rest of this file runs. On a
  # push there is no base to compare against, so everything counts as changed
  # and main is gated on the whole file exactly as before.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - id: filter
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -z "$BASE" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "not a pull request; everything runs"
            exit 0
          fi
          # Named as what cannot affect a build rather than what can, so a new
          # kind of file is treated as code until someone says otherwise. The
          # demos are workspace members and their .py and .mjs scripts are what
          # the round trips assert against, so nothing under demo/ is prose.
          if git diff --name-only "$BASE"...HEAD \
              | grep -qvE '^(README\.md|DESIGN\.md)$'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
            echo "only the top-level prose changed; the cargo jobs are skipped"
          fi

  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all

  # The end-to-end proofs: a real host process importing generated bindings and
  # calling them. `cargo jedem run` builds the binding, places the artefact
  # under the name that runtime imports, and runs the script -- the eight lines
  # of shell each of these used to need now live in the tool.
  roundtrips:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: "22" }
      - run: cargo install --path crates/cargo-jedem
      - run: cargo jedem run --python test.py
        working-directory: demo/python
      - run: cargo jedem run --node test.mjs
        working-directory: demo/node
